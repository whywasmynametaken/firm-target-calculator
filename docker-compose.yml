services:
  firm-target-calculator:
    image: ghcr.io/whywasmynametaken/firm-target-calculator:latest
    pull_policy: always
    container_name: firm-target-calculator
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      AUTH_SECRET: "replace-with-a-long-random-secret"
      OWNER_SETUP_CODE: "replace-with-a-setup-code"
      COOKIE_SECURE: "false"
      PORT: "3000"
    volumes:
      - firm-target-calculator-data:/data

volumes:
  firm-target-calculator-data:
